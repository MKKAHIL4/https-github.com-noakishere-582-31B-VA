{% extends "base.html" %}

{% block title %}
Add Book | Shelf

{% endblock%}

{% block content %}
<section class="book-form">

    <h1>Add a book </h1>

    <p>Add a book to your personal shelf collection</p>


    <form method="post">

        <div class="form-group">

        
        <label for="title">Book Title</label>

        <input

            id="title"
            name="title"
            type="text"
            placeholder="Enter book title"
            required
        >

        </div>

        <div class="form-group">

            <label for="author">Author</label>

            <input

                id="author"
                name="author"
                type="text"
                placeholder="Enter Author name"
            required
            >
            
        </div>

        <div class="form-group">

            <label for="description">Description</label>

            <textarea

                id="description"
                name="description"
                rows="5"
                placeholder="Write a short description of the book">

            </textarea>
        </div>

        <button type="submit">
            Add Book
        </button>

    </form>
    
</section>

{% endblock %}
