{% extends "base.html" %}

{% block title %}
Add Book | Shelf

{% endblock%}

{% block content %}
<section class="book-form">

    <h1>Add a book </h1>

    <p>Add a book to your personal shelf collection</p>


    <form method="post">

        <div class="form-group">

        
        <label for="title">Book Title</label>

        <input

            id="title"
            name="title"
            type="text"
            placeholder="Enter book title"
            required
        >

        </div>

        <div class="form-group">

            <label for="author">Author</label>

            <input

                id="author"
                name="author"
                type="text"
                placeholder="Enter Author name"
            required
            >
            
        </div>

        <div class="form-group">

            <label for="note">Book Note</label>

            <textarea

                id="note"
                name="note"
                rows="5"
                maxlength="1000"
                placeholder="Add a note about this book ">

            </textarea>
        </div>
        <div class="form-group">
            <label for="status">Reading Status</label>
       
                <select 
                    id="status"
                    name="status"
                    required
                >
                <option value="Want to read" >
                    Want to read
                </option>

                <option value="Reading" >
                    Reading
                </option>

                <option value="Finished" >
                    Finished
                </option>
            </select>

        </div>

        <button type="submit">
            Add Book
        </button>

    </form>

</section>

{% endblock %}
