{% extends "base.html" %}

{% block title %}
Login | Shelf

{% endblock%}

{% block content %}

<h1>Login</h1>

<form method="post">
    <label for="email">Email</label>

    <input
        id="email"
        name="email"
        type="email"
        required
    >
    


    <div>
        <label for="password">Password</label>

        <input
            id="password"
            name="password"
            type="password"
            minlength="8"
            required
        >
        
    </div>

    <button type="submit">
        Login
    </button>
</form>
{% endblock%}
